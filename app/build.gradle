plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.babyfoon'
    compileSdk 34

    defaultConfig {
        applicationId 'nl.babyfoon'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
